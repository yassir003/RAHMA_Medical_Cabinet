server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/cabinet_medical?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Africa/Casablanca
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
jwt.secret=cabinet_medical_secret_key_256bits_change_in_production
jwt.expiration=86400000
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
spring.jms.pub-sub-domain=false
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4o-mini 
resilience4j.circuitbreaker.instances.patientService.sliding-window-size=10
resilience4j.circuitbreaker.instances.patientService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.patientService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.rdvService.sliding-window-size=10
resilience4j.circuitbreaker.instances.rdvService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.consultationService.sliding-window-size=10
resilience4j.circuitbreaker.instances.dossierService.sliding-window-size=10
resilience4j.circuitbreaker.instances.aiService.sliding-window-size=5
resilience4j.circuitbreaker.instances.aiService.failure-rate-threshold=60
resilience4j.retry.instances.patientService.max-attempts=3
resilience4j.retry.instances.patientService.wait-duration=500ms
resilience4j.retry.instances.rdvService.max-attempts=3
resilience4j.retry.instances.rdvService.wait-duration=500ms
resilience4j.ratelimiter.instances.authService.limit-for-period=100
resilience4j.ratelimiter.instances.authService.limit-refresh-period=1m
resilience4j.ratelimiter.instances.authService.timeout-duration=0s
resilience4j.bulkhead.instances.consultationService.max-concurrent-calls=10
resilience4j.bulkhead.instances.consultationService.max-wait-duration=100ms
management.endpoints.web.exposure.include=health,info,circuitbreakers,metrics
management.endpoint.health.show-details=always
cors.allowed-origins=http://localhost:3000
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
rmi.registry.port=1099
logging.level.com.cabinet.medical=DEBUG
